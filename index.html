/* --------------------------------------------------------------- token -- */
:root{
  /* 字族 */
  --fal-display:"Public Sans","PingFang SC","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
  --fal-ui:"Public Sans","PingFang SC","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
  --fal-mono:"Chivo Mono","SFMono-Regular",Menlo,Consolas,monospace;

  /* 品牌色 —— 蓝色系（2026-08-04 改）
     实测取值：#115EF3 是 fal 的链接色，等于它的 --info-600 hsl(220 90% 51%)；
     #1DCBF7 = --brand-cyan-solid hsl(192 93% 54%)；#142657 是顶栏/页脚的大面积深底。
     原来的紫色 #7630F8 降级为次要点缀，只留在海报色里，不再承担界面主色。 */
  --fal-primary:#115ef3;
  --fal-primary-hover:#0d4ad2;
  --fal-primary-weak:#dbecff;      /* --info-100 hsl(212 100% 93%) */
  --fal-primary-ink:#1641b6;       /* --info-700 hsl(224 78% 40%) */
  --fal-navy:#142657;              /* 实测大面积深蓝底 */
  --fal-secondary:#1dcbf7;
  --fal-secondary-weak:#e2f8ff;

  /* 海报色（fal 官网营销面用的高彩平涂色，只用于图形块与强调面，不做界面底色） */
  --fal-poster-cyan:#99edff;
  --fal-poster-blue:#115ef3;
  --fal-poster-navy:#142657;
  --fal-poster-lime:#c8ff3d;
  --fal-poster-pink:#ffc4d8;
  --fal-poster-violet:#7630f8;     /* 保留但降级：只做点缀，不做主色 */

  /* 语义色（由 fal HSL token 换算）
     info 改到青色一侧，避免和蓝色主色撞到一起分不出「操作」与「提示」。 */
  --fal-error:#f00550;   --fal-error-weak:#ffe8ee;
  --fal-warning:#ffb21f; --fal-warning-weak:#fff4dd;
  --fal-success:#078c2a; --fal-success-weak:#e2fbe6;
  --fal-info:#0e9dc4;    --fal-info-weak:#e0f6fc;

  /* 明亮面 */
  --fal-surface:#ffffff;
  --fal-surface-light:#fafafa;
  --fal-surface-sunken:#f4f4f5;
  --fal-surface-hover:rgba(22,22,24,.04);
  --fal-surface-active:rgba(22,22,24,.07);
  --fal-page:#fafafa;

  --fal-content:#19191a;
  --fal-content-light:#494950;
  --fal-content-lighter:#666670;
  --fal-content-subtle:#8a8a93;
  --fal-content-inverse:#fafafa;
  --fal-ink-solid:#202022;      /* fal 的黑按钮 */

  --fal-stroke:rgba(25,25,26,.08);
  --fal-stroke-strong:rgba(25,25,26,.13);   /* 实测面板/按钮边线 */
  --fal-stroke-stronger:rgba(25,25,26,.22);

  /* 几何：fal 的识别点——4px 圆角贯穿全部控件与面板 */
  --fal-r:4px;
  --fal-r-lg:8px;
  --fal-r-xl:12px;
  --fal-r-pill:999px;

  /* 控件高度 */
  --fal-h-xs:24px; --fal-h-sm:28px; --fal-h-md:32px; --fal-h-lg:36px; --fal-h-xl:40px;

  /* 阴影：app 面几乎不用阴影，只有浮层用 */
  --fal-shadow-pop:0 0 0 1px var(--fal-stroke),0 10px 15px -3px rgba(0,0,0,.10),0 4px 6px -2px rgba(0,0,0,.05);
  --fal-shadow-over:0 0 0 1px var(--fal-stroke),0 25px 50px -12px rgba(0,0,0,.25);

  --fal-focus:0 0 0 2px var(--fal-surface),0 0 0 4px var(--fal-primary);
  --fal-t:140ms cubic-bezier(.2,0,.2,1);

  --fal-bar-h:52px;
  --fal-z-bar:40; --fal-z-drawer:60; --fal-z-modal:70; --fal-z-toast:80;
}

:root[data-theme="dark"]{
  --fal-surface:#19191a;          /* neutral-950 */
  --fal-surface-light:#202022;    /* neutral-900 */
  --fal-surface-sunken:#161618;   /* neutral-1000 */
  --fal-surface-hover:rgba(255,255,255,.05);
  --fal-surface-active:rgba(255,255,255,.08);
  --fal-page:#161618;

  --fal-content:#f4f4f5;
  --fal-content-light:#a1a1aa;
  --fal-content-lighter:#8a8a93;
  --fal-content-subtle:#666670;
  --fal-content-inverse:#19191a;
  --fal-ink-solid:#f4f4f5;

  --fal-stroke:rgba(255,255,255,.05);
  --fal-stroke-strong:rgba(255,255,255,.10);
  --fal-stroke-stronger:rgba(255,255,255,.15);

  --fal-primary:#57a8ff;           /* --info-400 hsl(211 100% 67%) */
  --fal-primary-hover:#8fc9ff;     /* --info-300 hsl(209 100% 78%) */
  --fal-primary-weak:rgba(87,168,255,.16);
  --fal-primary-ink:#a8cdff;
  --fal-navy:#0d1836;
  --fal-secondary-weak:rgba(29,203,247,.14);

  --fal-error:#ff4d7d;   --fal-error-weak:rgba(255,77,125,.15);
  --fal-warning:#ffc44d; --fal-warning-weak:rgba(255,196,77,.15);
  --fal-success:#3ddc6a; --fal-success-weak:rgba(61,220,106,.15);
  --fal-info:#3ec8ea;    --fal-info-weak:rgba(62,200,234,.15);

  --fal-shadow-pop:0 0 0 1px var(--fal-stroke),0 10px 15px -3px rgba(0,0,0,.45),0 4px 6px -2px rgba(0,0,0,.35);
  --fal-shadow-over:0 0 0 1px var(--fal-stroke),0 25px 50px -12px rgba(0,0,0,.6);
  --fal-focus:0 0 0 2px var(--fal-surface),0 0 0 4px var(--fal-primary);
}

/* ----------------------------------------------------------------- 基础 -- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;background:var(--fal-page);color:var(--fal-content);
  font:400 16px/1.5 var(--fal-ui);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  font-feature-settings:"cv11","ss01";
}
h1,h2,h3,h4,h5,p,figure{margin:0}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit;margin:0}
button{border:0;background:none;cursor:pointer}
img{display:block;max-width:100%}
/* svg 不写 max-width:100%——在 grid/flex 居中容器里会把有固定尺寸的图标压成几 px。 */
svg{display:block}
:focus-visible{outline:none;box-shadow:var(--fal-focus)}
::selection{background:var(--fal-primary);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--fal-stroke-stronger);border-radius:var(--fal-r-pill);border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--fal-content-subtle);background-clip:padding-box;border:3px solid transparent}

/* ----------------------------------------------------------------- 排版 --
   fal 的标题写法：一行内 300 与 700 并置（namespace/name），负字距随字号变大。
   ------------------------------------------------------------------------ */
.fal-display{font-family:var(--fal-display);font-weight:500;letter-spacing:-.04em;line-height:1.02}
.fal-h1{font-family:var(--fal-display);font-size:clamp(30px,4.4vw,52px);font-weight:700;letter-spacing:-.04em;line-height:1.04}
.fal-h2{font-family:var(--fal-display);font-size:24px;font-weight:600;letter-spacing:-.024em;line-height:1.16}
.fal-h3{font-family:var(--fal-display);font-size:20px;font-weight:600;letter-spacing:-.018em;line-height:1.2}
.fal-title{font-size:20px;font-weight:300;letter-spacing:-.012em;line-height:1.4}   /* 实测 h1：weight 300 */
.fal-title b,.fal-title strong{font-weight:700}
.fal-lede{font-size:16px;line-height:1.55;color:var(--fal-content-light)}
.fal-body{font-size:14px;line-height:1.6}
.fal-meta{font-size:13px;line-height:1.5;color:var(--fal-content-lighter)}
.fal-micro{font-size:12px;line-height:16px;color:var(--fal-content-lighter)}
.fal-mono{font-family:var(--fal-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.fal-kicker{font-family:var(--fal-mono);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--fal-content-lighter)}
.fal-num{font-family:var(--fal-mono);font-variant-numeric:tabular-nums;font-weight:500;letter-spacing:-.03em}
.fal-muted{color:var(--fal-content-lighter)}
.fal-truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.fal-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ----------------------------------------------------------------- 布局 -- */
.fal-shell{width:min(1440px,100% - 48px);margin-inline:auto}
.fal-stack{display:flex;flex-direction:column}
.fal-row{display:flex;align-items:center}
.fal-gap-1{gap:4px}.fal-gap-2{gap:8px}.fal-gap-3{gap:12px}.fal-gap-4{gap:16px}.fal-gap-6{gap:24px}
.fal-spacer{margin-left:auto}
.fal-grid{display:grid;gap:12px}

/* ----------------------------------------------------------------- 按钮 --
   实测：h36/h40，14px/600，字距 -.01em，左右 16px，圆角 4px，边框 1px，无阴影。
   ------------------------------------------------------------------------ */
.fal-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:var(--fal-h-lg);padding:0 16px;
  border:1px solid var(--fal-stroke-strong);border-radius:var(--fal-r);
  background:var(--fal-surface);color:var(--fal-content);
  font-size:14px;font-weight:600;letter-spacing:-.01em;line-height:20px;white-space:nowrap;
  transition:background var(--fal-t),border-color var(--fal-t),color var(--fal-t),opacity var(--fal-t);
}
.fal-btn:hover{background:var(--fal-surface-hover);border-color:var(--fal-stroke-stronger)}
.fal-btn:active{background:var(--fal-surface-active)}
.fal-btn[disabled],.fal-btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.fal-btn--primary{background:var(--fal-primary);border-color:transparent;color:#fff}
.fal-btn--primary:hover{background:var(--fal-primary-hover);border-color:transparent}
.fal-btn--solid{background:var(--fal-ink-solid);border-color:transparent;color:var(--fal-content-inverse)}
.fal-btn--solid:hover{background:var(--fal-ink-solid);border-color:transparent;opacity:.88}
.fal-btn--ghost{background:transparent;border-color:transparent}
.fal-btn--ghost:hover{background:var(--fal-surface-hover);border-color:transparent}
.fal-btn--danger{color:var(--fal-error);border-color:var(--fal-stroke-strong)}
.fal-btn--danger:hover{background:var(--fal-error-weak);border-color:var(--fal-error)}
.fal-btn--xl{height:var(--fal-h-xl)}
.fal-btn--sm{height:var(--fal-h-md);padding:0 10px;font-size:13px}
.fal-btn--xs{height:var(--fal-h-sm);padding:0 8px;font-size:12px}
.fal-btn--icon{width:var(--fal-h-lg);padding:0}
.fal-btn--icon.fal-btn--sm{width:var(--fal-h-md)}
.fal-btn--icon.fal-btn--xs{width:var(--fal-h-sm)}
.fal-btn--link{height:auto;padding:0;border:0;background:none;color:var(--fal-primary-ink);
  text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.fal-btn--link:hover{background:none;color:var(--fal-primary)}

/* 分段控件（Preview | JSON） */
.fal-seg{display:inline-flex;padding:2px;gap:2px;background:var(--fal-surface-sunken);
  border:1px solid var(--fal-stroke-strong);border-radius:var(--fal-r)}
.fal-seg > button{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;
  border-radius:2px;font-size:13px;font-weight:600;letter-spacing:-.01em;color:var(--fal-content-light);
  transition:background var(--fal-t),color var(--fal-t)}
.fal-seg > button:hover{color:var(--fal-content)}
.fal-seg > button[aria-pressed="true"],.fal-seg > button.is-on{background:var(--fal-surface);color:var(--fal-content);box-shadow:0 0 0 1px var(--fal-stroke)}

/* ------------------------------------------------------------- 面板/卡片 --
   实测：1px 边线 + 4px 圆角 + 无阴影，靠边线分层，不靠投影。
   ------------------------------------------------------------------------ */
.fal-panel{background:var(--fal-surface);border:1px solid var(--fal-stroke-strong);border-radius:var(--fal-r);min-width:0}
.fal-panel__head{display:flex;align-items:center;gap:8px;min-height:48px;padding:10px 16px;border-bottom:1px solid var(--fal-stroke-strong)}
.fal-panel__title{font-size:16px;font-weight:600;letter-spacing:-.016em}
.fal-panel__body{padding:16px}
.fal-panel__body--flush{padding:0}
.fal-panel__foot{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--fal-stroke-strong)}

.fal-card{display:block;background:var(--fal-surface);border:1px solid var(--fal-stroke-strong);
  border-radius:var(--fal-r);overflow:hidden;transition:border-color var(--fal-t),background var(--fal-t)}
a.fal-card:hover,button.fal-card:hover{border-color:var(--fal-stroke-stronger);background:var(--fal-surface-light)}
.fal-card__media{aspect-ratio:1/1;background:var(--fal-surface-sunken);overflow:hidden}
.fal-card__media img{width:100%;height:100%;object-fit:cover}
.fal-card__body{padding:12px 14px}

/* ------------------------------------------------------------------ 标签 --
   fal 的 chip 不填色：小图标 + 彩色文字；徽章才填 5% 底。
   ------------------------------------------------------------------------ */
.fal-chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;letter-spacing:-.01em;
  line-height:16px;color:var(--fal-content-lighter);white-space:nowrap}
.fal-chip .fal-dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.fal-chip--primary{color:var(--fal-primary-ink)}
.fal-chip--success{color:var(--fal-success)}
.fal-chip--info{color:var(--fal-info)}
.fal-chip--warning{color:#a86400}
.fal-chip--error{color:var(--fal-error)}

.fal-badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;
  border:1px solid transparent;border-radius:var(--fal-r);
  background:var(--fal-surface-active);color:var(--fal-content-light);
  font-size:12px;font-weight:600;letter-spacing:-.01em;line-height:16px;white-space:nowrap}
.fal-badge--primary{background:var(--fal-primary-weak);color:var(--fal-primary-ink)}
.fal-badge--success{background:var(--fal-success-weak);color:var(--fal-success)}
.fal-badge--warning{background:var(--fal-warning-weak);color:#a86400}
.fal-badge--error{background:var(--fal-error-weak);color:var(--fal-error)}
.fal-badge--info{background:var(--fal-info-weak);color:var(--fal-info)}
.fal-badge--outline{background:transparent;border-color:var(--fal-stroke-strong)}

/* ------------------------------------------------------------------ 标签页 --
   实测：h40，16px/500，2px 下边线，激活主色。
   ------------------------------------------------------------------------ */
.fal-tabs{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--fal-stroke-strong)}
.fal-tabs::-webkit-scrollbar{display:none}
.fal-tab{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:var(--fal-h-xl);padding:0 16px;flex:none;
  border-bottom:2px solid transparent;margin-bottom:-1px;
  font-size:16px;font-weight:500;letter-spacing:-.012em;color:var(--fal-content-light);white-space:nowrap;
  transition:color var(--fal-t),border-color var(--fal-t)}
.fal-tab:hover{color:var(--fal-content)}
.fal-tab[aria-current="page"],.fal-tab[aria-selected="true"]{color:var(--fal-content);border-bottom-color:var(--fal-primary)}

/* ----------------------------------------------------------------- 表单 -- */
.fal-field{display:flex;align-items:center;width:100%;height:var(--fal-h-lg);padding:0 10px;
  border:1px solid var(--fal-stroke-strong);border-radius:var(--fal-r);
  background:var(--fal-surface);font-size:14px;letter-spacing:-.01em;
  transition:border-color var(--fal-t),box-shadow var(--fal-t)}
textarea.fal-field{height:auto;min-height:88px;padding:8px 10px;line-height:1.55;resize:vertical}
select.fal-field{appearance:none;padding-right:28px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 14px) calc(50% + 1px),calc(100% - 9px) calc(50% + 1px);
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.fal-field:hover{border-color:var(--fal-stroke-stronger)}
.fal-field:focus,.fal-field:focus-visible{outline:none;border-color:var(--fal-primary);box-shadow:0 0 0 3px var(--fal-primary-weak)}
.fal-field::placeholder{color:var(--fal-content-subtle)}
.fal-label{display:block;font-size:13px;font-weight:600;letter-spacing:-.01em;margin-bottom:6px}
.fal-hint{font-size:12px;color:var(--fal-content-lighter);margin-top:5px}
.fal-search{position:relative}
.fal-search .fal-field{padding-left:32px}
.fal-search > svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--fal-content-subtle)}

/* ----------------------------------------------------------------- 表格 -- */
.fal-tablewrap{overflow-x:auto;border:1px solid var(--fal-stroke-strong);border-radius:var(--fal-r);background:var(--fal-surface)}
.fal-table{width:100%;border-collapse:collapse;font-size:14px}
.fal-table th{position:sticky;top:0;z-index:1;background:var(--fal-surface-light);
  text-align:left;font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--fal-content-lighter);
  padding:8px 12px;border-bottom:1px solid var(--fal-stroke-strong);white-space:nowrap}
.fal-table td{padding:9px 12px;border-bottom:1px solid var(--fal-stroke);vertical-align:middle}
.fal-table tbody tr:last-child td{border-bottom:0}
.fal-table tbody tr:hover{background:var(--fal-surface-hover)}
.fal-table th[aria-sort]{cursor:pointer;user-select:none}
.fal-table th[aria-sort]:hover{color:var(--fal-content)}

/* ----------------------------------------------------------------- 进度 -- */
.fal-meter{height:4px;border-radius:var(--fal-r-pill);background:var(--fal-surface-active);overflow:hidden}
.fal-meter > i{display:block;height:100%;border-radius:inherit;background:var(--fal-primary);transition:width 240ms cubic-bezier(.2,0,.2,1)}
.fal-meter--lime > i{background:var(--fal-secondary)}

/* ------------------------------------------------------------ 抽屉/弹窗 -- */
.fal-scrim{position:fixed;inset:0;z-index:var(--fal-z-drawer);background:rgba(22,22,24,.5);opacity:0;pointer-events:none;transition:opacity var(--fal-t)}
.fal-scrim.is-open{opacity:1;pointer-events:auto}
.fal-drawer{position:fixed;top:0;right:0;bottom:0;z-index:calc(var(--fal-z-drawer) + 1);
  width:min(560px,100%);display:flex;flex-direction:column;
  background:var(--fal-surface);border-left:1px solid var(--fal-stroke-strong);
  transform:translateX(100%);transition:transform 200ms cubic-bezier(.2,0,.2,1)}
.fal-drawer.is-open{transform:none}
.fal-drawer__head{display:flex;align-items:flex-start;gap:12px;padding:16px;border-bottom:1px solid var(--fal-stroke-strong)}
.fal-drawer__body{flex:1;overflow-y:auto;padding:16px}
.fal-drawer__foot{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--fal-stroke-strong);background:var(--fal-surface)}

.fal-modal{position:fixed;inset:0;z-index:var(--fal-z-modal);display:grid;place-items:center;padding:24px;
  opacity:0;pointer-events:none;transition:opacity var(--fal-t)}
.fal-modal.is-open{opacity:1;pointer-events:auto}
.fal-modal__panel{width:min(460px,100%);background:var(--fal-surface);border-radius:var(--fal-r-lg);
  box-shadow:var(--fal-shadow-over);transform:translateY(6px);transition:transform 200ms cubic-bezier(.2,0,.2,1)}
.fal-modal.is-open .fal-modal__panel{transform:none}

/* ----------------------------------------------------------------- 顶栏 -- */
.fal-bar{position:sticky;top:0;z-index:var(--fal-z-bar);background:var(--fal-surface);border-bottom:1px solid var(--fal-stroke-strong)}
.fal-bar__in{display:flex;align-items:center;gap:12px;min-height:var(--fal-bar-h);padding:8px 0}

/* --------------------------------------------------------------- 空状态 -- */
.fal-empty{padding:40px 20px;text-align:center;color:var(--fal-content-lighter);font-size:14px}
.fal-empty strong{display:block;color:var(--fal-content);font-size:15px;font-weight:600;margin-bottom:6px}

/* ------------------------------------------------------------- 海报区块 --
   fal 官网营销面：高彩平涂底 + 超大黑字 + 图形块。只用于页头，不进工作区。
   ------------------------------------------------------------------------ */
.fal-poster{position:relative;overflow:hidden;background:var(--fal-poster-cyan);color:#000;border-radius:var(--fal-r-lg)}
.fal-poster--violet{background:var(--fal-poster-violet);color:#fff}
.fal-poster--lime{background:var(--fal-poster-lime);color:#000}
.fal-poster__in{position:relative;z-index:1;padding:clamp(20px,3.4vw,40px)}

/* --------------------------------------------------------------- 动效 -- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important;scroll-behavior:auto !important}
}

/* --------------------------------------------------------------- 响应 -- */
@media (max-width:860px){
  :root{--fal-h-md:34px;--fal-h-lg:40px;--fal-h-xl:44px}
  .fal-shell{width:min(1440px,100% - 32px)}
  .fal-btn{font-size:14px}
  .fal-tab{font-size:15px;padding:0 12px}
  .fal-panel__body{padding:14px}
  .fal-drawer{top:auto;left:0;width:100%;max-height:88vh;border-left:0;border-top:1px solid var(--fal-stroke-strong);
    border-radius:var(--fal-r-xl) var(--fal-r-xl) 0 0;transform:translateY(100%)}
}


/* ============================================================================
   新加坡旅行手册 · 页面层样式
   只写 fal.css 未覆盖的业务结构；配色/尺寸一律走 --fal-* token。
   页头 + 地图 = marketing register（海报色、大字）；
   工作区（航班/逐日/待办）= console register（4px 圆角、发丝边线、无阴影）。
   ========================================================================= */

/* ---------- 图标 ---------- */
.icon{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.icon-sm{width:15px;height:15px}
.icon-fill{fill:currentColor;stroke:none}
.sprite{position:absolute;width:0;height:0;overflow:hidden}

/* ---------- 布局容器 ---------- */
.wrap{width:min(760px,100% - 32px);margin-inline:auto}
.app{padding:14px 0 64px}
.sec{margin-top:28px}
.sec__head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.sec__title{font-family:var(--fal-display);font-size:20px;font-weight:300;letter-spacing:-.018em;line-height:1.3}
.sec__title b{font-weight:700}
.sec__note{font-size:12px;color:var(--fal-content-subtle);margin-left:auto;text-align:right;font-family:var(--fal-mono);letter-spacing:-.01em}
/* 可折叠区块：区块头变按钮 + 右侧 chevron */
.sec--fold > .sec__head{width:100%;background:none;border:0;cursor:pointer;padding:0;align-items:center;color:inherit;font:inherit}
.sec--fold > .sec__head:focus-visible{outline:none;box-shadow:var(--fal-focus);border-radius:var(--fal-r)}
.sec__chev{width:18px;height:18px;flex:none;margin-left:auto;color:var(--fal-content-subtle);transition:transform var(--fal-t)}
.sec--fold.is-collapsed > .sec__head{margin-bottom:0}
.sec--fold.is-collapsed .sec__chev{transform:rotate(-90deg)}
.sec--fold.is-collapsed > .sec__wrap{display:none}

/* ---------- 顶栏 ---------- */
.bar{position:sticky;top:0;z-index:var(--fal-z-bar);background:var(--fal-surface);border-bottom:1px solid var(--fal-stroke-strong);
  padding-top:env(safe-area-inset-top)}
.bar__in{display:flex;align-items:center;gap:10px;min-height:50px}
.bar__mark{display:inline-flex;align-items:center;gap:8px}
.bar__logo{width:26px;height:26px;border-radius:var(--fal-r);flex:none}
.bar__name{font-size:14px;font-weight:700;letter-spacing:-.02em}
.bar__name span{font-weight:300;color:var(--fal-content-lighter)}
.bar__spacer{margin-left:auto}
.bar__btn{width:36px;height:36px;display:grid;place-items:center;border-radius:var(--fal-r);
  border:1px solid var(--fal-stroke-strong);background:var(--fal-surface);color:var(--fal-content);
  transition:background var(--fal-t),border-color var(--fal-t)}
.bar__btn:hover{background:var(--fal-surface-hover);border-color:var(--fal-stroke-stronger)}

/* ---------- 页头海报 + 此刻关注（marketing register） ---------- */
.hero{position:relative;overflow:hidden;margin-top:14px;border-radius:var(--fal-r-xl);
  background:var(--fal-poster-navy);color:#fff;isolation:isolate}
.hero__art{position:absolute;inset:0;z-index:0;pointer-events:none}
.hero__in{position:relative;z-index:1;padding:clamp(20px,5.2vw,34px)}
.hero__kicker{font-family:var(--fal-mono);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--fal-poster-cyan)}
.hero__title{font-family:var(--fal-display);font-weight:600;letter-spacing:-.04em;line-height:1.02;
  font-size:clamp(34px,9vw,58px);margin-top:12px}
.hero__meta{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;
  font-family:var(--fal-mono);font-size:12.5px;letter-spacing:-.01em;color:rgba(255,255,255,.72)}
.hero__meta b{color:var(--fal-poster-cyan);font-weight:600}

.now{margin-top:22px;padding-top:20px;border-top:1px solid rgba(255,255,255,.16)}
.now__label{display:flex;align-items:center;gap:7px;font-family:var(--fal-mono);font-size:11px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.now__label .dot{width:7px;height:7px;border-radius:50%;background:var(--fal-poster-lime);flex:none;
  box-shadow:0 0 0 0 rgba(200,255,61,.6);animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(200,255,61,.55)}70%{box-shadow:0 0 0 9px rgba(200,255,61,0)}100%{box-shadow:0 0 0 0 rgba(200,255,61,0)}}
.now__event{margin-top:11px;font-family:var(--fal-display);font-size:clamp(19px,4.6vw,24px);font-weight:600;letter-spacing:-.02em;line-height:1.25}
.now__detail{margin-top:6px;font-size:13px;line-height:1.5;color:rgba(255,255,255,.72)}
.now__timer{margin-top:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:420px}
.tbox{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:var(--fal-r);padding:9px 4px;text-align:center}
.tbox__n{font-family:var(--fal-mono);font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:-.04em;
  font-size:clamp(24px,7vw,34px);line-height:1;color:var(--fal-poster-lime)}
.tbox__k{margin-top:6px;font-family:var(--fal-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.now--done .now__event{color:var(--fal-poster-cyan)}

/* ---------- 行程总览地图（marketing register） ---------- */
.mapcard{margin-top:14px;border:1px solid var(--fal-stroke-strong);border-radius:var(--fal-r-lg);
  background:var(--fal-surface);overflow:hidden}
.mapcard > svg{width:100%;height:auto;display:block}
.maplegend{display:flex;flex-wrap:wrap;gap:8px 14px;padding:12px 16px;border-top:1px solid var(--fal-stroke-strong);
  background:var(--fal-surface-light)}
.maplegend .lg{display:inline-flex;align-items:center;gap:6px;font-family:var(--fal-mono);font-size:11.5px;color:var(--fal-content-light);letter-spacing:-.01em}
.maplegend .lg i{width:14px;height:4px;border-radius:2px;flex:none}

/* ---------- 风险提示 ---------- */
.risks{display:grid;gap:8px}
.risk{display:flex;gap:11px;padding:12px 14px;border:1px solid var(--fal-stroke-strong);border-radius:var(--fal-r);
  background:var(--fal-surface);border-left-width:3px}
.risk--high{border-left-color:var(--fal-error)}
.risk--mid{border-left-color:var(--fal-warning)}
.risk__ic{flex:none;margin-top:1px}
.risk--high .risk__ic{color:var(--fal-error)}
.risk--mid .risk__ic{color:#a86400}
.risk__t{font-size:14px;font-weight:600;letter-spacing:-.01em}
.risk__x{margin-top:3px;font-size:13px;line-height:1.55;color:var(--fal-content-light)}

/* ---------- 通用面板/卡片网格 ---------- */
.cardgrid{display:grid;gap:10px}
@media (min-width:560px){.cardgrid--2{grid-template-columns:1fr 1fr}}

/* ---------- 航班卡 ---------- */
.flight{border:1px solid var(--fal-stroke-strong);border-radius:var(--fal-r);background:var(--fal-surface);overflow:hidden}
.flight__top{display:flex;align-items:center;gap:9px;padding:10px 13px;border-bottom:1px solid var(--fal-stroke)}
.flight__who{width:30px;height:30px;border-radius:var(--fal-r);flex:none;display:grid;place-items:center;
  background:var(--fal-primary-weak);color:var(--fal-primary-ink);font-family:var(--fal-mono);font-size:11px;font-weight:700;letter-spacing:-.02em}
.flight__name{font-size:14px;font-weight:600;letter-spacing:-.01em}
.flight__note{font-family:var(--fal-mono);font-size:11px;color:var(--fal-content-subtle);margin-left:auto}
.leg{display:grid;grid-template-columns:20px 42px 1fr;gap:9px;align-items:center;padding:8px 13px}
.leg+.leg{border-top:1px solid var(--fal-stroke)}
.leg__ic{color:var(--fal-content-subtle)}
.leg__code{font-family:var(--fal-mono);font-size:12px;font-weight:600;letter-spacing:-.02em;color:var(--fal-content-light)}
.leg__pts{font-size:12.5px;line-height:1.4;color:var(--fal-content)}
.leg__pts .arr{color:var(--fal-content-subtle);margin:0 5px}
.termbadge{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:3px;margin-left:6px;
  background:var(--fal-warning-weak);color:#a86400;font-family:var(--fal-mono);font-size:10.5px;font-weight:700;letter-spacing:.02em}

/* ---------- 酒店卡 ---------- */
.hotel{display:flex;flex-direction:column;border:1px solid var(--fal-stroke-strong);border-radius:var(--fal-r);background:var(--fal-surface);overflow:hidden}
.hotel__body{padding:13px 14px;flex:1}
.hotel__name{font-size:15px;font-weight:600;letter-spacing:-.015em;line-height:1.3}
.hotel__rows{margin-top:9px;display:grid;gap:5px}
.hrow{display:grid;grid-template-columns:52px 1fr;gap:8px;font-size:12.5px;line-height:1.5}
.hrow dt{color:var(--fal-content-subtle);font-family:var(--fal-mono);font-size:11px;letter-spacing:-.01em;padding-top:1px}
.hrow dd{margin:0;color:var(--fal-content-light)}
.hotel__foot{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--fal-stroke)}

/* ---------- 演唱会面板 ---------- */
.concert{border:1px solid var(--fal-stroke-strong);border-radius:var(--fal-r-lg);overflow:hidden;background:var(--fal-surface)}
.concert__top{position:relative;overflow:hidden;background:var(--fal-poster-navy);color:#fff;padding:18px}
.concert__art{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.9}
.concert__topin{position:relative;z-index:1}
.concert__k{font-family:var(--fal-mono);font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--fal-poster-cyan)}
.concert__name{font-family:var(--fal-display);font-size:clamp(26px,7vw,38px);font-weight:700;letter-spacing:-.04em;line-height:1;margin-top:8px}
.concert__tour{margin-top:7px;font-size:13px;color:rgba(255,255,255,.75)}
.concert__body{padding:14px}
.concert__meta{display:grid;gap:7px;margin-bottom:12px}
.cmeta{display:flex;align-items:flex-start;gap:9px;font-size:13px;line-height:1.5}
.cmeta .icon{color:var(--fal-content-subtle);margin-top:1px}
.shows{display:grid;gap:8px}
.show{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid var(--fal-stroke-strong);border-radius:var(--fal-r);background:var(--fal-surface-light)}
.show__date{font-family:var(--fal-mono);font-size:12px;font-weight:700;letter-spacing:-.02em;flex:none;width:64px}
.show__label{font-family:var(--fal-mono);font-size:10.5px;color:var(--fal-content-subtle)}
.show__who{margin-left:auto;display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.who-pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:var(--fal-r-pill);
  background:var(--fal-primary);color:#fff;font-family:var(--fal-mono);font-size:11px;font-weight:600;letter-spacing:-.01em}
.who-pill--soft{background:var(--fal-surface-active);color:var(--fal-content-light)}
.show__note{width:100%;font-size:11.5px;color:var(--fal-content-subtle);text-align:right}
.concert + .concert{margin-top:12px}
.concert__top--violet{background:var(--fal-poster-violet)}
.concert__top--violet .concert__k{color:#ECDCFF}

/* ---------- 逐日行程：标签页 + 时间线 ---------- */
.daytabs{position:sticky;top:calc(50px + env(safe-area-inset-top));z-index:20;background:var(--fal-page);
  padding-top:8px;margin-bottom:4px}
.daytabs__row{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--fal-stroke-strong)}
.daytabs__row::-webkit-scrollbar{display:none}
.daytab{display:flex;flex-direction:column;align-items:center;gap:1px;flex:none;padding:7px 14px;
  border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--fal-content-light);white-space:nowrap;
  transition:color var(--fal-t),border-color var(--fal-t)}
.daytab:hover{color:var(--fal-content)}
.daytab__d{font-family:var(--fal-mono);font-size:14px;font-weight:600;letter-spacing:-.02em}
.daytab__w{font-size:10.5px;color:var(--fal-content-subtle)}
.daytab[aria-selected="true"]{color:var(--fal-content);border-bottom-color:var(--fal-primary)}
.daytab[aria-selected="true"] .daytab__w{color:var(--fal-primary-ink)}

.dayview{display:none;animation:fade .18s ease}
.dayview.is-on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.dayhead{display:flex;align-items:baseline;gap:9px;margin:12px 0 4px}
.dayhead__t{font-family:var(--fal-display);font-size:17px;font-weight:600;letter-spacing:-.02em}
.dayhead__tz{font-family:var(--fal-mono);font-size:11px;color:var(--fal-content-subtle);margin-left:auto}
.daynote{display:flex;gap:9px;padding:10px 12px;margin:8px 0 4px;border-radius:var(--fal-r);
  background:var(--fal-info-weak);color:var(--fal-content-light);font-size:12.5px;line-height:1.55}
.daynote .icon{color:var(--fal-info);flex:none;margin-top:1px}

/* 时间线 */
.tl{margin-top:6px;position:relative}
.stop{display:grid;grid-template-columns:46px 1fr;gap:11px;position:relative;padding-bottom:4px}
.stop__time{font-family:var(--fal-mono);font-size:11.5px;font-weight:600;letter-spacing:-.02em;color:var(--fal-content-light);
  padding-top:16px;text-align:right}
.stop__rail{position:relative}
.stop__card{position:relative;display:flex;gap:11px;padding:11px;border:1px solid var(--fal-stroke-strong);border-radius:var(--fal-r);
  background:var(--fal-surface);transition:border-color var(--fal-t),background var(--fal-t);width:100%;text-align:left}
a.stop__card:hover{border-color:var(--fal-stroke-stronger);background:var(--fal-surface-light)}
.stop+.stop{margin-top:8px}
/* 时间线竖线：连接相邻 motif tile 中心 */
.stop:not(:last-child) .stop__rail::before{content:"";position:absolute;left:20px;top:52px;bottom:-16px;width:2px;
  background:var(--fal-stroke-strong);z-index:0}
.motif{width:40px;height:40px;border-radius:8px;flex:none;position:relative;z-index:1;display:grid;place-items:center;overflow:hidden}
.motif svg{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stop__main{min-width:0;flex:1}
.stop__crow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stop__name{margin-top:5px;font-size:14px;font-weight:600;letter-spacing:-.012em;line-height:1.35;display:flex;align-items:center;gap:6px}
.stop__name .icon-sm{color:var(--fal-content-subtle);flex:none}
a.stop__card:hover .stop__name .icon-sm{color:var(--fal-primary)}
.stop__note{margin-top:5px;font-size:12.5px;line-height:1.55;color:var(--fal-content-light)}
.stop__placeholder{margin-top:8px;padding:8px 10px;border:1px dashed var(--fal-stroke-stronger);border-radius:var(--fal-r);
  font-family:var(--fal-mono);font-size:11.5px;color:var(--fal-content-lighter);background:var(--fal-surface-sunken)}

/* ---------- 待办清单（纯列表，不可勾选） ---------- */
.todos{border:1px solid var(--fal-stroke-strong);border-radius:var(--fal-r);background:var(--fal-surface);overflow:hidden}
.todo{display:flex;gap:11px;padding:11px 14px;align-items:flex-start}
.todo+.todo{border-top:1px solid var(--fal-stroke)}
.todo__dot{width:6px;height:6px;flex:none;margin-top:8px;border-radius:50%;background:var(--fal-content-subtle)}
.todo__dot--book{background:var(--fal-warning);box-shadow:0 0 0 3px var(--fal-warning-weak)}
.todo__b{min-width:0}
.todo__when{display:inline-block;font-family:var(--fal-mono);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--fal-content-subtle);margin-right:7px}
.todo__tx{font-size:13.5px;line-height:1.55}
.todo__flag{display:inline-flex;align-items:center;height:18px;padding:0 6px;margin-left:6px;border-radius:3px;vertical-align:1px;
  background:var(--fal-warning-weak);color:#a86400;font-family:var(--fal-mono);font-size:10px;font-weight:700}

/* ---------- 贴士 ---------- */
.tips{display:grid;gap:9px}
@media (min-width:560px){.tips{grid-template-columns:1fr 1fr}}
.tip{display:flex;gap:11px;padding:13px 14px;border:1px solid var(--fal-stroke-strong);border-radius:var(--fal-r);background:var(--fal-surface)}
.tip__ic{width:32px;height:32px;flex:none;border-radius:var(--fal-r);display:grid;place-items:center;
  background:var(--fal-surface-sunken);color:var(--fal-content-light)}
.tip__t{font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.tip__x{margin-top:4px;font-size:12.5px;line-height:1.55;color:var(--fal-content-light)}

/* ---------- 页脚 ---------- */
.foot{margin-top:36px;padding:18px 0 0;border-top:1px solid var(--fal-stroke-strong);
  font-family:var(--fal-mono);font-size:11.5px;color:var(--fal-content-subtle);line-height:1.7;letter-spacing:-.01em}
.foot b{color:var(--fal-content-light);font-weight:600}

.chip-book{color:var(--fal-warning)}

/* 逐日行程里的参与人小标（who tag） */
.stop__people{font-family:var(--fal-mono);font-size:11px;color:var(--fal-content-subtle)}
/* 总览预览地图：地点图例 */
.maplegend .lg--day i{width:16px;height:3px;border-radius:2px}
.maphouse{width:13px;height:13px;flex:none;vertical-align:-2px;color:var(--fal-content)}
.mapfoot{padding:0 16px 12px;background:var(--fal-surface-light);font-family:var(--fal-mono);font-size:11px;color:var(--fal-content-subtle);line-height:1.5;letter-spacing:-.01em}

</style>
</head>

/* 地标关键词 → 更贴切的母题图标（覆盖分类默认） */
function motifIcon(stop) {
  const n = stop.name || "";
  if (/渡轮|ferry|bandar|tanah/i.test(n)) return "i-ferry";
  if (/演唱会|weeknd|stadium|开演|门开/i.test(n)) return "i-music";
  if (/樟宜|机场|起飞|抵|值机|changi|airport|返程/i.test(n)) return "i-plane";
  if (/gardens|花园|滨海湾|牛车水|公园|marina/i.test(n)) return "i-sight";
  if (/chick|吃|餐|早餐|用餐/i.test(n)) return "i-food";
  if (/酒店|入住|退房|residence|bencoolen|米酒店/i.test(n)) return "i-bed";
  return (CAT[stop.category] || CAT["其他"]).icon;
}
function motifTile(stop) {
  const c = CAT[stop.category] || CAT["其他"];
  const icon = motifIcon(stop);
  return `<span class="motif" style="background:${c.bg};color:${c.fg}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#${icon}"/></svg></span>`;
}
function catChip(cat) {
  const map = { "交通": "primary", "酒店": "", "吃喝": "warning", "景点": "success", "演唱会": "primary", "购物": "info", "其他": "" };
  const tone = map[cat] || "";
  return `<span class="fal-chip ${tone ? "fal-chip--" + tone : ""}"><span class="fal-dot"></span>${esc(cat)}</span>`;
}
function mapHref(m) {
  if (!m) return null;
  if (/^https?:/i.test(m)) return m;
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(m);
}

/* ---------------------------------------------------------- 此刻关注 / 倒计时 */
let timer = null;
function fmtDelta(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  return { d: Math.floor(s / 86400), h: Math.floor(s % 86400 / 3600), m: Math.floor(s % 3600 / 60), s: s % 60 };
}
const pad = n => String(n).padStart(2, "0");
function nextEvent() {
  const now = Date.now();
  const evs = (DATA.events || []).map(e => ({ ...e, t: new Date(e.at).getTime() })).sort((a, b) => a.t - b.t);
  return evs.find(e => e.t > now) || null;
}
function renderNow() {
  const now = $("#now");
  const ev = nextEvent();
  if (!ev) {
    now.className = "now now--done";
    now.innerHTML = `<div class="now__label"><span class="dot"></span>行程</div>
      <div class="now__event">旅途愉快 — 一路已排好</div>
      <div class="now__detail">所有已排事件都已开始或结束。把这个链接留着随时查行程。</div>`;
    if (timer) { clearInterval(timer); timer = null; }
    return;
  }
  const t = fmtDelta(ev.t - Date.now());
  now.className = "now";
  now.innerHTML = `<div class="now__label"><span class="dot"></span>下一站</div>
    <div class="now__event">${esc(ev.title)}</div>
    <div class="now__detail">${esc(ev.detail || "")}</div>
    <div class="now__timer" id="nowTimer"></div>`;
  paintTimer(t);
  if (!timer) timer = setInterval(tick, 1000);
}
function paintTimer(t) {
  const box = (n, k) => `<div class="tbox"><div class="tbox__n">${n}</div><div class="tbox__k">${k}</div></div>`;
  const wrap = $("#nowTimer");
  if (wrap) wrap.innerHTML = box(t.d, "天") + box(pad(t.h), "时") + box(pad(t.m), "分") + box(pad(t.s), "秒");
}
function tick() {
  const ev = nextEvent();
  if (!ev) { renderNow(); return; }
  const left = ev.t - Date.now();
  if (left <= 0) { renderNow(); return; }        // 过点→自动跳下一个
  const cur = $("#now .now__event");
  if (!cur || cur.textContent !== ev.title) { renderNow(); return; }
  paintTimer(fmtDelta(left));
}

  for (let i = 1; i < pts.length - 1; i++) {
    const xc = (pts[i].x + pts[i + 1].x) / 2, yc = (pts[i].y + pts[i + 1].y) / 2;
    d += ` Q ${pts[i].x} ${pts[i].y} ${xc} ${yc}`;
  }
  d += ` L ${pts[pts.length - 1].x} ${pts[pts.length - 1].y}`;
  return d;
}
function renderMap() {
  const P = MAP.places;
  const routes = MAP.routes.map(r => {
    const c = DAYCOLORS[r.day];
    const main = `<path d="${mapSmooth(r.pts.map(k => P[k]))}" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>`;
    const extra = (r.extra || []).map(([a, b]) =>
      `<path d="M ${P[a].x} ${P[a].y} L ${P[b].x} ${P[b].y}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="1 7" opacity=".8"/>`).join("");
    return main + extra;
  }).join("");
  const markers = Object.values(P).map(p => {
    const lp = p.lp || "b";
    const dx = lp === "l" ? -11 : lp === "r" ? 11 : 0, dy = lp === "t" ? -13 : lp === "b" ? 21 : 4;
    const anchor = lp === "l" ? "end" : lp === "r" ? "start" : "middle";
    const marker = p.house
      ? `<path d="M ${p.x - 7} ${p.y - 1} L ${p.x} ${p.y - 9} L ${p.x + 7} ${p.y - 1} M ${p.x - 5} ${p.y - 2} V ${p.y + 6} H ${p.x + 5} V ${p.y - 2}" fill="var(--fal-surface)" stroke="var(--fal-content)" stroke-width="1.7" stroke-linejoin="round"/>`
      : `<circle cx="${p.x}" cy="${p.y}" r="5" fill="#FF7A66" stroke="var(--fal-surface)" stroke-width="1.6"/>`;
    return `${marker}<text x="${p.x + dx}" y="${p.y + dy}" text-anchor="${anchor}" font-family="var(--fal-mono)" font-size="11" fill="var(--fal-content-light)" paint-order="stroke" stroke="var(--fal-surface)" stroke-width="2.6" stroke-linejoin="round">${esc(p.label)}</text>`;
  }).join("");
  const svg = `<svg viewBox="0 0 680 440" width="100%" role="img" aria-label="行程相对位置预览：樟宜入境、市区多点、渡轮跨海去民丹岛；路线按天着色，房子标记过夜地点">
    <ellipse cx="404" cy="214" rx="262" ry="130" fill="var(--fal-surface-sunken)" opacity=".6"/>
    <ellipse cx="566" cy="396" rx="88" ry="46" fill="var(--fal-surface-sunken)" opacity=".6"/>
    <text x="34" y="30" font-family="var(--fal-mono)" font-size="11" fill="var(--fal-content-subtle)">西 ←</text>
    <text x="646" y="30" text-anchor="end" font-family="var(--fal-mono)" font-size="11" fill="var(--fal-content-subtle)">→ 东</text>
    <text x="340" y="30" text-anchor="middle" font-family="var(--fal-mono)" font-size="11" fill="var(--fal-content-lighter)">樟宜入境 · 市区(Bugis / 体育场 / 滨海湾) · 渡轮跨海去民丹岛</text>
    <text x="34" y="426" font-family="var(--fal-mono)" font-size="10.5" fill="var(--fal-content-subtle)">境外出发 → 10/1–10/3 陆续抵樟宜</text>
    ${routes}
    ${markers}
  </svg>`;
  const legendDays = MAP.routes.map(r => `<span class="lg lg--day"><i style="background:${DAYCOLORS[r.day]}"></i>${r.day}</span>`).join("");
  $("#mapCard").innerHTML = svg + `<div class="maplegend">${legendDays}
    <span class="lg"><svg class="maphouse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 11 12 4l8 7M6 10v9h12v-9"/></svg>过夜地点</span>
  </div><div class="mapfoot">房子标记为过夜地点 · 路线颜色按天区分 · 详细导航请展开逐日卡片</div>`;
}

/* ---------------------------------------------------------- 风险 */
function renderRisks() {
  $("#risks").innerHTML = (DATA.risks || []).map(r => {
    const cls = r.level === "high" ? "risk--high" : "risk--mid";
    return `<div class="risk ${cls}"><span class="risk__ic">${ic(r.level === "high" ? "i-alert" : "i-clock")}</span>
      <div><div class="risk__t">${esc(r.title)}</div><div class="risk__x">${esc(r.text)}</div></div></div>`;
  }).join("");
}

/* ---------------------------------------------------------- 航班 */
function renderFlights() {
  $("#flNote").textContent = "";
  const termBadge = s => s.replace(/(T[34])/g, '<span class="termbadge">$1</span>');
  $("#flights").innerHTML = (DATA.flights || []).map(f => `
    <div class="flight">
      <div class="flight__top">
        <span class="flight__who">${esc(f.who)}</span>
        <span class="flight__name">${esc(f.who)}</span>
        ${f.note ? `<span class="flight__note">${esc(f.note)}</span>` : ""}
      </div>
      <div class="leg"><span class="leg__ic">${ic("i-plane","icon-sm")}</span><span class="leg__code">${esc(f.outCode)}</span>
        <span class="leg__pts">${esc(f.outDep)}<span class="arr">→</span>${termBadge(esc(f.outArr))}</span></div>
      <div class="leg"><span class="leg__ic" style="transform:scaleX(-1)">${ic("i-plane","icon-sm")}</span><span class="leg__code">${esc(f.backCode)}</span>
        <span class="leg__pts">${termBadge(esc(f.backDep))}<span class="arr">→</span>${esc(f.backArr)}</span></div>
    </div>`).join("");
  const note = el("p", "", esc(DATA.flightNote || ""));
  note.style.cssText = "grid-column:1/-1;margin:2px 2px 0;font-size:12px;line-height:1.55;color:var(--fal-content-lighter)";
  $("#flights").appendChild(note);
}

/* ---------------------------------------------------------- 酒店 */
function renderHotels() {
  $("#hotels").innerHTML = (DATA.hotels || []).map(h => {
    const rows = [
      ["住客", h.guests], ["夜数", h.stay], ["入退", h.checkin],
      h.address ? ["地址", h.address] : null, h.meals ? ["餐食", h.meals] : null
    ].filter(Boolean).map(([k, v]) => `<div class="hrow"><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("");
    return `<div class="hotel"><div class="hotel__body">
        <div class="hotel__name">${esc(h.name)}${h.tz ? ` <span class="fal-chip fal-chip--info" style="vertical-align:2px"><span class="fal-dot"></span>${esc(h.tz)}</span>` : ""}</div>
        <dl class="hotel__rows">${rows}</dl>
      </div>
      <div class="hotel__foot"><a class="fal-btn fal-btn--sm" href="${esc(mapHref(h.map))}" target="_blank" rel="noopener">${ic("i-map","icon-sm")} 导航</a></div>
    </div>`;
  }).join("");
}

/* ---------------------------------------------------------- 演唱会 */
function concertPanel(c) {
  const violet = c.accent === "violet";
  const pills = who => who.map(w => `<span class="who-pill">${esc(w)}</span>`).join("");
  const shows = (c.shows || []).map(s => `
    <div class="show"><span class="show__date">${esc(s.date)}</span>${s.label ? `<span class="show__label">${esc(s.label)}</span>` : ""}
      <span class="show__who">到场 ${pills(s.who)}</span>
    </div>`).join("");
  const meta = [
    `<div class="cmeta">${ic("i-pin","icon-sm")}<span>${esc(c.venue)}${c.address ? " · " + esc(c.address) : ""}</span></div>`,
    c.time ? `<div class="cmeta">${ic("i-clock","icon-sm")}<span>${esc(c.time)}</span></div>` : "",
    c.ticketNote ? `<div class="cmeta">${ic("i-ticket","icon-sm")}<span>${esc(c.ticketNote)}</span></div>` : ""
  ].join("");
  return `<div class="concert">
    <div class="concert__top${violet ? " concert__top--violet" : ""}">
      <div class="concert__art" aria-hidden="true"><svg viewBox="0 0 400 150" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">
        <path d="M-10 120c70-30 120-30 190 0s120 30 190 0 60-16 60-16" fill="none" stroke="${violet ? "#C8FF3D" : "#1DCBF7"}" stroke-width="14" opacity=".18" stroke-linecap="round"/>
        <circle cx="330" cy="46" r="30" fill="${violet ? "#99EDFF" : "#C8FF3D"}" opacity=".22"/>
      </svg></div>
      <div class="concert__topin">
        <div class="concert__k">${esc(c.tour)}</div>
        <div class="concert__name">${esc(c.title)}</div>
        ${c.subtitle ? `<div class="concert__tour">${esc(c.subtitle)}</div>` : ""}
      </div>
    </div>
    <div class="concert__body">
      <div class="concert__meta">${meta}</div>
      <div class="shows">${shows}</div>
      <div style="margin-top:12px"><a class="fal-btn fal-btn--sm" href="${esc(mapHref(c.map))}" target="_blank" rel="noopener">${ic("i-map","icon-sm")} ${esc(c.navLabel || "导航")}</a></div>
    </div>
  </div>`;
}
function renderConcert() {
  $("#concert").innerHTML = (DATA.concerts || []).map(concertPanel).join("");
}

/* ---------------------------------------------------------- 逐日行程 */
let activeDay = 0;
function sgtTodayISO() {
  // 取新加坡当地日期 YYYY-MM-DD
  try { return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Singapore" }).format(new Date()); }
  catch { return new Date().toISOString().slice(0, 10); }
}
function pickDefaultDay() {
  const today = sgtTodayISO();               // e.g. 2026-10-03
  const md = today.slice(5).replace("-", "."); // 10.03
  const idx = DATA.days.findIndex(d => d.date === md);
  if (idx >= 0) return idx;
  const up = DATA.days.findIndex(d => ("2026-" + d.date.replace(".", "-")) >= today);
  return up >= 0 ? up : 0;
}
function renderDays() {
  const tabs = $("#dayTabs"), views = $("#dayViews");
  tabs.innerHTML = ""; views.innerHTML = "";
  DATA.days.forEach((d, i) => {
    const tab = el("button", "daytab");
    tab.type = "button"; tab.setAttribute("role", "tab");
    tab.innerHTML = `<span class="daytab__d">${esc(d.date)}</span><span class="daytab__w">${esc(d.weekday)}</span>`;
    tab.onclick = () => selectDay(i);
    tabs.appendChild(tab);

    const view = el("div", "dayview");
    view.setAttribute("role", "tabpanel");
    view.innerHTML = dayHTML(d);
    views.appendChild(view);
  });
  selectDay(pickDefaultDay());
}
function dayHTML(d) {
  const note = d.dayNote ? `<div class="daynote">${ic("i-flag","icon-sm")}<span>${esc(d.dayNote)}</span></div>` : "";
  const stops = (d.stops || []).map(s => stopHTML(s)).join("");
  return `<div class="dayhead"><span class="dayhead__t">${esc(d.title)}</span><span class="dayhead__tz">${esc(d.tz)}</span></div>
    ${note}<div class="tl">${stops}</div>`;
}
function stopHTML(s) {
  const flags = s.flags || [];
  const href = mapHref(s.map);
  const booking = flags.includes("booking") ? `<span class="fal-badge fal-badge--warning">${ic("i-flag","icon-sm")}需订</span>` : "";
  const warn = flags.includes("warn") ? `<span class="fal-badge fal-badge--error">${ic("i-alert","icon-sm")}硬约束</span>` : "";
  const nameInner = `${esc(s.name)}${href ? ic("i-ext", "icon-sm") : ""}`;
  const cardTag = href ? "a" : "div";
  const attrs = href ? ` href="${esc(href)}" target="_blank" rel="noopener"` : "";
  const ph = flags.includes("placeholder")
    ? `<div class="stop__placeholder">班次待确认 · 请以电子船票为准</div>` : "";
  return `<div class="stop">
    <div class="stop__time">${esc(s.time || "")}</div>
    <div class="stop__rail">
      <${cardTag} class="stop__card"${attrs}>
        ${motifTile(s)}
        <div class="stop__main">
          <div class="stop__crow">${catChip(s.category)}${s.who ? `<span class="stop__people">${esc(s.who.join(" + "))}</span>` : ""}${booking}${warn}</div>
          <div class="stop__name">${nameInner}</div>
          ${s.note ? `<div class="stop__note">${esc(s.note)}</div>` : ""}
          ${ph}
        </div>
      </${cardTag}>
    </div>
  </div>`;
}
function selectDay(i) {
  activeDay = i;
  [...$("#dayTabs").children].forEach((t, k) => t.setAttribute("aria-selected", k === i ? "true" : "false"));
  [...$("#dayViews").children].forEach((v, k) => v.classList.toggle("is-on", k === i));
  const tab = $("#dayTabs").children[i];
  if (tab) tab.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
}

/* ---------------------------------------------------------- 待办 */
function renderTodos() {
  $("#todos").innerHTML = (DATA.todos || []).map(t => {
    const book = t.flag === "booking";
    return `<div class="todo"><span class="todo__dot ${book ? "todo__dot--book" : ""}"></span>
      <div class="todo__b"><span class="todo__tx">${t.when ? `<span class="todo__when">${esc(t.when)}</span>` : ""}${esc(t.text)}${book ? `<span class="todo__flag">需订</span>` : ""}</span></div>
    </div>`;
  }).join("");
}

/* ---------------------------------------------------------- 贴士 */
function renderTips() {
  const map = { moon: "i-moon", clock: "i-clock", music: "i-music", food: "i-food", sight: "i-sight", ferry: "i-ferry", pin: "i-pin" };
  $("#tips").innerHTML = (DATA.tips || []).map(t =>
    `<div class="tip"><span class="tip__ic">${ic(map[t.icon] || "i-pin")}</span>
      <div><div class="tip__t">${esc(t.title)}</div><div class="tip__x">${esc(t.text)}</div></div></div>`).join("");
}

/* ---------------------------------------------------------- 页脚 */
function renderFoot() {
  $("#foot").innerHTML = `点任意地点唤起 Google 地图导航 · ${esc(DATA.meta.tzNote)}`;
}

/* ---------------------------------------------------------- 主题（按本地时间自动 + 手动） */
const TKEY = "sgtrip_theme";
function autoByHour() { const h = new Date().getHours(); return (h >= 19 || h < 7) ? "dark" : "light"; }
function applyTheme(mode) {
  const resolved = mode === "auto" ? autoByHour() : mode;
  document.documentElement.setAttribute("data-theme", resolved);
  $("#themeIcon use").setAttribute("href", resolved === "dark" ? "#i-sun" : "#i-moon");
  document.querySelector('meta[name="theme-color"]').setAttribute("content", resolved === "dark" ? "#161618" : "#142657");
}
function initTheme() {
  let mode = "auto";
  try { mode = localStorage.getItem(TKEY) || "auto"; } catch {}
  applyTheme(mode);
  $("#themeBtn").onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : "dark";
    applyTheme(next);
    try { localStorage.setItem(TKEY, next); } catch {}
  };
  // 未手动指定时，随本地时间跨越 19:00 / 07:00 自动切换
  setInterval(() => { let m = "auto"; try { m = localStorage.getItem(TKEY) || "auto"; } catch {} if (m === "auto") applyTheme("auto"); }, 60000);
}

/* ---------------------------------------------------------- 装配 */
function init() {
  renderHead();
  renderMap();
  renderRisks();
  renderFlights();
  renderHotels();
  renderConcert();
  renderDays();
  renderTodos();
  renderTips();
  renderFoot();
  initTheme();
  initFold();
}
/* 区块折叠：区块头点击切换（键盘可用，button 原生支持 Enter/Space） */
function initFold() {
  document.querySelectorAll(".sec--fold > .sec__head").forEach(head => {
    head.addEventListener("click", () => {
      const sec = head.closest(".sec--fold");
      const collapsed = sec.classList.toggle("is-collapsed");
      head.setAttribute("aria-expanded", String(!collapsed));
    });
  });
}
init();
</script>
